const newState=()=>({version:1,tasks:[],milestones:[],exerciseDone:{},settings:defaultSettings()});
let storageError=false,initialError='';
let state=newState();
try{const raw=localStorage.getItem(STORAGE);if(raw)state=validateState(JSON.parse(raw));}catch(e){storageError=true;initialError='本地数据未能读取，请导出当前数据或从备份恢复。';}
let selected=today(),calendarMode='week',calendarAnchor=selected,view='calendar',filter='open',search='',toastTimer,undoState=null,lastToday=today();
const $=s=>document.querySelector(s);
function validateState(raw){
 if(!raw||raw.version!==1||!Array.isArray(raw.tasks)||!Array.isArray(raw.milestones)||raw.tasks.length>20000||raw.milestones.length>5000)throw Error('不是有效的时序备份文件');
 const text=(v,max=500)=>typeof v==='string'&&v.length<=max;
 const seen=new Set();
 const tasks=raw.tasks.map(t=>{if(!t||!text(t.id,100)||seen.has(t.id)||!text(t.title,200)||!t.title.trim()||!(t.date===''||validDate(t.date))||!SLOT_IDS.includes(t.slot)||!['high','normal','low'].includes(t.priority)||!Number.isInteger(t.minutes)||t.minutes<5||t.minutes>600||!(t.due===''||validDate(t.due))||typeof t.done!=='boolean'||!text(t.note,3000))throw Error('任务数据格式不正确');seen.add(t.id);return {id:t.id,title:t.title.trim(),date:t.date,slot:t.slot,priority:t.priority,minutes:t.minutes,due:t.due,done:t.done,note:t.note};});
 const milestones=raw.milestones.map(m=>{if(!m||!text(m.id,100)||seen.has(m.id)||!text(m.title,200)||!m.title.trim()||!validDate(m.date)||!['exam','deadline','other'].includes(m.type)||typeof m.done!=='boolean'||!text(m.note,3000))throw Error('倒数日数据格式不正确');seen.add(m.id);return {id:m.id,title:m.title.trim(),date:m.date,type:m.type,done:m.done,note:m.note};});
 const s=raw.settings;if(!s||!validDate(s.semester)||parseDate(s.semester).getDay()!==1||typeof s.courseHints!=='boolean'||typeof s.exerciseEnabled!=='boolean')throw Error('设置数据格式不正确');
 const slots={};let previousEnd=0;for(const id of SLOT_IDS){const pair=s.slots?.[id];if(!Array.isArray(pair)||pair.length!==2||!pair.every(validTime)||minutes(pair[1])<=minutes(pair[0])||minutes(pair[0])<previousEnd)throw Error('专注时段需按顺序排列，且不能重叠');previousEnd=minutes(pair[1]);slots[id]=[...pair];}
 if(!Array.isArray(s.exercise)||s.exercise.length!==2||!s.exercise.every(validTime)||minutes(s.exercise[0])>=minutes(s.exercise[1]))throw Error('锻炼时间格式不正确');
 if(s.exerciseEnabled&&SLOT_IDS.some(id=>minutes(s.exercise[0])<minutes(slots[id][1])&&minutes(s.exercise[1])>minutes(slots[id][0])))throw Error('锻炼时间不能与专注时段重叠');
 const exerciseDone={};if(raw.exerciseDone&&typeof raw.exerciseDone==='object')for(const [date,done]of Object.entries(raw.exerciseDone)){if(validDate(date)&&done===true)exerciseDone[date]=true;}
 return {version:1,tasks,milestones,settings:{semester:s.semester,courseHints:s.courseHints,slots,exercise:[...s.exercise],exerciseEnabled:s.exerciseEnabled},exerciseDone};
}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));storageError=false;}catch(e){storageError=true;toast('浏览器无法保存，请立即导出备份。');}updateSaveLabel();}
function updateSaveLabel(){const el=$('#save-status');if(el)el.textContent=storageError?'尚未保存，请导出备份':'自动保存在此浏览器';}
function mutate(fn,message,undo=true){if(undo)undoState={state:clone(state),selected,calendarAnchor};fn();save();render();if(message)toast(message,undo);}
function toast(message,undo=false){clearTimeout(toastTimer);$('#toast').innerHTML=`<span>${esc(message)}</span>${undo?'<button data-action="undo">撤销</button>':''}`;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),6500);}
function courseEvents(date){if(!state.settings.courseHints)return [];const week=Math.floor(dateDiff(date,state.settings.semester)/7)+1;const day=(parseDate(date).getDay()+6)%7+1;return (window.COURSE_DATA||[]).filter(c=>c.day===day&&c.weeks.includes(week)&&c.end<=8&&!c.name.includes('实验'));}
function capacity(date,slot){const [a,b]=state.settings.slots[slot].map(minutes);const spans=courseEvents(date).map(c=>[Math.max(a,minutes(SECTIONS[c.start-1][0])),Math.min(b,minutes(SECTIONS[c.end-1][1]))]).filter(([a,b])=>a<b).sort((x,y)=>x[0]-y[0]);let busy=0,end=-1;for(const [a,b]of spans){busy+=Math.max(0,b-Math.max(a,end));end=Math.max(end,b);}return {total:b-a,available:b-a-busy,busy};}
const tasksIn=(date,slot)=>state.tasks.filter(t=>t.date===date&&(!slot||t.slot===slot));
const plannedMinutes=(date,slot,exclude)=>tasksIn(date,slot).filter(t=>t.id!==exclude).reduce((n,t)=>n+t.minutes,0);
function sortedTasks(tasks){return [...tasks].sort((a,b)=>(a.done-b.done)||((a.due||'9999').localeCompare(b.due||'9999'))||({high:0,normal:1,low:2}[a.priority]-{high:0,normal:1,low:2}[b.priority]));}
function allDates(){return [...state.milestones.filter(m=>!m.done).map(m=>({...m,kind:'milestone'})),...state.tasks.filter(t=>t.due&&!t.done).map(t=>({id:t.id,title:t.title,date:t.due,type:'deadline',kind:'task',done:false,note:t.note}))].sort((a,b)=>a.date.localeCompare(b.date));}
const onDates=date=>allDates().filter(m=>m.date===date);
function deadlineLabel(date){const n=dateDiff(date,today());return n===0?'今天截止':n<0?`已逾期 ${-n} 天`:`还有 ${n} 天`;}
function stats(date){const tasks=tasksIn(date);return {count:tasks.length,done:tasks.filter(t=>t.done).length,minutes:tasks.reduce((a,t)=>a+t.minutes,0)};}
function taskLine(t,wide=false){return `<div class="task-line ${t.done?'completed':''}" draggable="true" data-task-id="${esc(t.id)}"><button class="check ${t.done?'checked':''}" role="checkbox" aria-checked="${t.done}" aria-label="${t.done?'取消完成':'完成'} ${esc(t.title)}" data-action="toggle-task" data-id="${esc(t.id)}">${t.done?icon('check'):''}</button><button class="task-content" data-action="edit-task" data-id="${esc(t.id)}"><span class="task-title">${esc(t.title)}</span><span class="task-meta"><i class="priority-dot ${t.priority}"></i>${t.minutes} 分钟${wide?`<span>· ${t.date?`${shortDate(t.date)} ${SLOT_NAMES[t.slot]}`:'待安排'}</span>`:''}${t.due?`<span class="${t.due<today()&&!t.done?'overdue-text':''}">· ${deadlineLabel(t.due)}</span>`:''}</span></button>${wide&&!t.done?`<div class="task-actions">${!t.date?`<button class="text-button" data-action="schedule-task" data-id="${esc(t.id)}">安排</button>`:`<button class="text-button" data-action="tomorrow" data-id="${esc(t.id)}">顺延</button>`}<button class="icon-button" data-action="edit-task" data-id="${esc(t.id)}" aria-label="编辑 ${esc(t.title)}">${icon('edit')}</button></div>`:''}</div>`;}
function render(){
 const names={calendar:'日历计划',tasks:'任务清单',milestones:'重要日子',settings:'偏好设置'};
 $('#navigation').innerHTML=[['calendar','calendar'],['tasks','list'],['milestones','flag'],['settings','settings']].map(([id,ic])=>`<button class="nav-item ${view===id?'active':''}" data-action="nav" data-view="${id}" aria-label="${names[id]}" ${view===id?'aria-current="page"':''}>${icon(ic)}<span>${names[id]}</span>${id==='tasks'&&state.tasks.some(t=>!t.done)?`<b class="count">${state.tasks.filter(t=>!t.done).length}</b>`:''}</button>`).join('');
 $('#breadcrumb-title').textContent=names[view];$('#today-label').textContent=`${fullDate(today())} · ${WEEKDAYS[(parseDate(today()).getDay()+6)%7]}`;
 document.querySelector('.sidebar-bottom .icon-button').innerHTML=icon('download');updateSaveLabel();renderMini();
 $('#main').innerHTML=view==='calendar'?renderPlanner():view==='tasks'?renderTasks():view==='milestones'?renderMilestones():renderSettings();
}
function renderMini(){const d=parseDate(selected),first=localDate(new Date(d.getFullYear(),d.getMonth(),1));const start=weekStart(first);$('#mini-calendar').innerHTML=`<div class="mini-title"><b>${d.getFullYear()}年 ${d.getMonth()+1}月</b><div><button class="icon-button" data-action="mini-month" data-delta="-1" aria-label="上个月">${icon('left')}</button><button class="icon-button" data-action="mini-month" data-delta="1" aria-label="下个月">${icon('right')}</button></div></div><div class="mini-grid">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}${Array.from({length:42},(_,i)=>{const date=addDays(start,i);return `<button class="mini-day ${date===selected?'selected':''} ${date===today()?'today':''} ${date.slice(0,7)!==first.slice(0,7)?'out':''} ${onDates(date).length?'has-event':''}" data-action="select-date" data-date="${date}" aria-label="${fullDate(date)}">${+date.slice(-2)}</button>`;}).join('')}</div>`;}
function renderPlanner(){const st=stats(selected);const isToday=selected===today();const dateTitle=isToday?'今天，也有自己的节奏。':`${shortDate(selected)}，安排好每一段专注。`;
 return `<section class="intro"><div class="intro-left"><span class="eyebrow">A LITTLE PLAN, A FOCUSED DAY</span><h1>${dateTitle}</h1><p>先选一件重要的事，从一个专注时段开始。</p></div><div class="intro-summary"><div class="intro-stat"><b>${st.done}<span style="font-size:14px;color:#adb6a5"> / ${st.count}</span></b><small>${isToday?'今日':'所选日'}完成</small></div><div class="intro-divider"></div><div class="intro-stat"><b>${+(st.minutes/60).toFixed(1)}<span style="font-size:12px;color:#a3ae99"> h</span></b><small>已安排专注</small></div></div></section>
 <div class="layout"><div class="primary-column"><section><div class="section-heading"><h2>专注计划 <span class="day-badge">${WEEKDAYS[(parseDate(selected).getDay()+6)%7]}</span></h2><div class="plan-heading-actions"><input aria-label="计划日期" class="plan-date" type="date" value="${selected}" id="plan-date"><button class="text-button" data-action="rollover">未完成顺延 ${icon('arrow')}</button></div></div><div class="focus-grid">${SLOT_IDS.map(renderFocus).join('')}</div>${state.settings.exerciseEnabled?`<div class="exercise">${icon('exercise')}<div><b>留一点时间，动起来</b><small>${state.settings.exercise.join(' – ')} · 锻炼 / 散步 / 拉伸</small></div><button role="checkbox" aria-checked="${!!state.exerciseDone[selected]}" class="check ${state.exerciseDone[selected]?'checked':''}" data-action="exercise" aria-label="${state.exerciseDone[selected]?'取消':'标记'}锻炼完成">${state.exerciseDone[selected]?icon('check'):''}</button></div>`:''}</section>${renderCalendar()}</div><aside class="rail">${renderCountdownRail()}${renderTaskRail()}<section class="panel review-panel"><div class="day-review"><div class="progress-ring" style="--progress:${st.count?st.done/st.count*100:0}%"><span>${st.count?Math.round(st.done/st.count*100):0}%</span></div><div><b>每一步，都算数。</b><p>${st.count?`已完成 ${st.done} 项，剩余 ${st.count-st.done} 项。`:'安排第一项任务，开始记录。'}</p></div></div></section></aside></div>`;
}
function renderFocus(slot){const tasks=sortedTasks(tasksIn(selected,slot));const cap=capacity(selected,slot),used=plannedMinutes(selected,slot);const usedStr=`${used} / ${cap.available} 分钟`;return `<article class="focus-card ${slot}" data-drop-date="${selected}" data-drop-slot="${slot}"><header class="focus-head"><div class="focus-heading"><span>${icon({morning:'sun',afternoon:'afternoon',evening:'moon'}[slot])}<h3>${SLOT_NAMES[slot]}</h3></span><small>${tasks.filter(t=>t.done).length}/${tasks.length}</small></div><time>${state.settings.slots[slot].join(' – ')}</time></header><div class="focus-body">${tasks.length?tasks.map(t=>taskLine(t)).join(''):`<div class="focus-empty">${icon('leaf')}${{morning:'留给最重要的思考',afternoon:'把想法一步步落实',evening:'巩固、复盘，慢慢收尾'}[slot]}</div>`}<div class="capacity ${used>cap.available?'warn':''}">${usedStr}${used>cap.available?` · 超出 ${used-cap.available} 分钟`:cap.busy?` · 课程占用 ${cap.busy} 分钟`:' · 已安排 / 可用'}</div></div><button class="focus-add" data-action="new-task" data-date="${selected}" data-slot="${slot}">＋ 添加一项任务</button></article>`;}
function renderCountdownRail(){const items=allDates().slice(0,4);return `<section class="panel"><div class="panel-title"><h2>重要日子 <small>COUNTDOWN</small></h2><button class="icon-button" aria-label="添加倒数日" data-action="new-milestone">${icon('plus')}</button></div>${items.length?items.map(countdownRow).join(''):`<div class="rail-empty"><div class="empty-icon">${icon('flag')}</div><strong>让重要的日子，有迹可循</strong>考试、作业截止、一个小目标。<br>添加日期后，每天自动倒数。<br><button class="button small soft" data-action="new-milestone">＋ 添加倒数日</button></div>`}${items.length?'<button class="text-button" data-action="nav" data-view="milestones" style="margin-top:17px">查看全部日子 →</button>':''}</section>`;}
function countdownRow(m){const n=dateDiff(m.date,today());return `<div class="countdown"><button class="countdown-info" data-action="${m.kind==='task'?'edit-task':'edit-milestone'}" data-id="${esc(m.id)}"><strong>${esc(m.title)}</strong><small>${{exam:'考试',deadline:'截止日',other:'目标日'}[m.type]} · ${shortDate(m.date)}</small></button><div class="count-number ${n<0?'overdue':n<=7?'urgent':''}"><strong>${Math.abs(n)}</strong><small>${n<0?'已过 / 天':n===0?'就是今天':'天后'}</small></div></div>`;}
function renderTaskRail(){const list=sortedTasks(state.tasks.filter(t=>!t.done&&(!t.date||t.date<=today())));return `<section class="panel task-panel"><div class="panel-title"><h2>当前待办 <small>${list.length?String(list.length).padStart(2,'0'):''}</small></h2><button class="text-button" data-action="nav" data-view="tasks">全部 ${icon('arrow')}</button></div><div class="rail-task-list">${list.length?list.slice(0,6).map(t=>taskLine(t)).join(''):`<div class="rail-empty"><div class="empty-icon">${icon('list')}</div><strong>先记下来，再慢慢安排</strong>这里收集待安排、今天及之前<br>尚未完成的任务。</div>`}</div><form id="quick-task" class="quick-entry"><input name="title" aria-label="快速记下一件事" placeholder="快速记下一件事…" required maxlength="200"><button aria-label="加入任务清单" type="submit">${icon('plus')}</button></form><p class="panel-note">可拖入左侧专注时段，或打开任务安排。</p></section>`;}
function renderCalendar(){const anchor=parseDate(calendarAnchor);const start=weekStart(calendarAnchor),end=addDays(start,6);const title=calendarMode==='week'?`${shortDate(start)} – ${shortDate(end)}`:`${anchor.getFullYear()}年 ${anchor.getMonth()+1}月`;return `<section class="calendar-panel"><div class="calendar-toolbar"><div class="calendar-title"><h2>${title}</h2><small>${calendarMode==='week'?start.slice(0,4):'月度概览'}</small></div><div class="calendar-controls"><button class="icon-button" aria-label="上一${calendarMode==='week'?'周':'月'}" data-action="calendar-prev">${icon('left')}</button><button class="button small" data-action="today">今天</button><button class="icon-button" aria-label="下一${calendarMode==='week'?'周':'月'}" data-action="calendar-next">${icon('right')}</button><div class="segmented"><button class="${calendarMode==='week'?'active':''}" data-action="calendar-mode" data-mode="week">周</button><button class="${calendarMode==='month'?'active':''}" data-action="calendar-mode" data-mode="month">月</button></div></div></div>${calendarMode==='week'?renderWeek(start):renderMonth(calendarAnchor)}<footer class="calendar-footer"><span class="legend"><i></i>上午</span><span class="legend blue"><i></i>下午</span><span class="legend purple"><i></i>晚间</span><span class="legend green"><i></i>锻炼</span><span class="footer-tip">拖动任务，即可调整日期与时段</span></footer></section>`;}
function renderWeek(start){const days=Array.from({length:7},(_,i)=>addDays(start,i));return `<div class="calendar-scroll"><div class="week-grid"><div class="week-header"></div>${days.map((date,i)=>`<button class="week-header ${date===selected?'selected':''} ${date===today()?'today':''}" data-action="select-date" data-date="${date}">${WEEKDAYS[i]}<b>${+date.slice(-2)}</b></button>`).join('')}${SLOT_IDS.map(slot=>`<div class="week-time">${SLOT_NAMES[slot].slice(0,2)}<span>${state.settings.slots[slot][0]}<br>${state.settings.slots[slot][1]}</span></div>${days.map(date=>{const cap=capacity(date,slot);return `<div class="week-cell ${date===selected?'selected':''}" data-drop-date="${date}" data-drop-slot="${slot}">${slot==='morning'?onDates(date).map(m=>`<button class="cell-deadline" data-action="${m.kind==='task'?'edit-task':'edit-milestone'}" data-id="${esc(m.id)}">${m.type==='exam'?'考试':'截止'} · ${esc(m.title)}</button>`).join(''):''}${tasksIn(date,slot).map(t=>`<button class="week-task ${slot} ${t.done?'done':''}" draggable="true" data-task-id="${esc(t.id)}" data-action="edit-task" data-id="${esc(t.id)}">${t.done?'✓ ':''}${esc(t.title)}<br><span style="opacity:.65">${t.minutes} 分钟</span></button>`).join('')}${cap.busy?`<span class="course-hint">课程占用 ${cap.busy}′</span>`:''}<button class="cell-add" data-action="new-task" data-date="${date}" data-slot="${slot}" aria-label="添加${shortDate(date)}${SLOT_NAMES[slot]}任务">＋</button></div>`;}).join('')}`).join('')}</div></div>`;}
function renderMonth(anchor){const d=parseDate(anchor),first=localDate(new Date(d.getFullYear(),d.getMonth(),1)),start=weekStart(first);return `<div class="month-grid">${WEEKDAYS.map(x=>`<div class="month-weekday">${x}</div>`).join('')}${Array.from({length:42},(_,i)=>{const date=addDays(start,i),st=stats(date);return `<div class="month-cell ${date===selected?'selected':''} ${date.slice(0,7)!==first.slice(0,7)?'out':''}"><button class="month-date ${date===today()?'today':''}" data-action="select-date" data-date="${date}" aria-label="查看${fullDate(date)}计划">${+date.slice(-2)}</button>${onDates(date).slice(0,2).map(m=>`<button class="cell-deadline" data-action="${m.kind==='task'?'edit-task':'edit-milestone'}" data-id="${esc(m.id)}">${esc(m.title)}</button>`).join('')}${st.count?`<button class="month-summary" data-action="select-date" data-date="${date}">${st.done}/${st.count} 项 · ${+(st.minutes/60).toFixed(1)}h</button>`:''}</div>`;}).join('')}</div>`;}
function renderTasks(){const labels={open:'未完成',today:'今天',unscheduled:'待安排',overdue:'已逾期',done:'已完成',all:'全部'};let list=state.tasks.filter(t=>filter==='open'?!t.done:filter==='today'?t.date===today():filter==='unscheduled'?!t.date&&!t.done:filter==='overdue'?t.due&&t.due<today()&&!t.done:filter==='done'?t.done:true);if(search)list=list.filter(t=>(t.title+' '+t.note).toLowerCase().includes(search.toLowerCase()));return `<div class="view-wide"><header class="wide-header"><span class="eyebrow">LESS IN YOUR HEAD, MORE IN YOUR DAY</span><h1 style="margin-top:9px">任务清单</h1><p>把零散的想法记下来，再放进合适的专注时段。按截止日期、优先级排序。</p></header><div class="filters">${Object.entries(labels).map(([id,label])=>`<button class="filter ${filter===id?'active':''}" data-action="filter" data-filter="${id}">${label}</button>`).join('')}<input class="search-input" id="task-search" placeholder="搜索任务或备注" aria-label="搜索任务或备注" value="${esc(search)}"></div><div class="section-heading"><span class="block-date">共 ${list.length} 项</span><button class="button small soft" data-action="auto-plan">把待办安排到 ${shortDate(selected)}</button></div><div class="task-table">${list.length?sortedTasks(list).map(t=>taskLine(t,true)).join(''):`<div class="empty-large">${icon('list')}<h3>${search?'没有找到匹配任务':'给下一步，留个位置'}</h3><p>${search?'试试换个关键词。':'新建任务时可以直接选日期和时段，<br>也可以先留在「待安排」。'}</p><button class="button primary" data-action="new-task">＋ 新建任务</button></div>`}</div></div>`;}
function renderMilestones(){const items=allDates();const completed=state.milestones.filter(m=>m.done);return `<div class="view-wide"><header class="wide-header"><span class="eyebrow">SOMETHING TO LOOK FORWARD TO</span><div class="section-heading" style="margin-top:9px"><h1>重要日子</h1><button class="button primary" data-action="new-milestone">＋ 添加倒数日</button></div><p>考试、截止日和想实现的目标。天数按北京时间的自然日计算；任务截止日会自动出现在这里。</p></header>${items.length?`<div class="milestone-grid">${items.map(m=>{const n=dateDiff(m.date,today());return `<article class="milestone-card"><span class="tag">${{exam:'考试',deadline:'截止日',other:'目标日'}[m.type]}${m.kind==='task'?' · 来自任务':''}</span><button class="icon-button" data-action="${m.kind==='task'?'edit-task':'edit-milestone'}" data-id="${esc(m.id)}" aria-label="编辑${esc(m.title)}">${icon('edit')}</button><h3>${esc(m.title)}</h3><div class="large-number" ${n<0?'style="color:#b47762"':''}>${Math.abs(n)}<small>${n<0?'天前已到期':n===0?'就是今天':'天后'}</small></div><p>${fullDate(m.date)}</p>${m.note?`<p class="notes-text" style="margin-top:12px">${esc(m.note)}</p>`:''}</article>`;}).join('')}</div>`:`<div class="panel empty-large">${icon('flag')}<h3>下一件重要的事，在什么时候？</h3><p>添加真实的考试或任务截止日期，<br>倒数日会同时显示在日历上。</p><button class="button soft" data-action="new-milestone">＋ 添加第一个日期</button></div>`}${completed.length?`<details class="settings-card" style="margin-top:23px"><summary>已完成的日子（${completed.length}）</summary>${completed.map(m=>`<div class="countdown"><button class="countdown-info" data-action="edit-milestone" data-id="${esc(m.id)}"><strong>✓ ${esc(m.title)}</strong><small>${fullDate(m.date)}</small></button></div>`).join('')}</details>`:''}</div>`;}
function renderSettings(){const s=state.settings;return `<div class="view-wide"><header class="wide-header"><span class="eyebrow">MAKE ROOM FOR YOUR OWN RHYTHM</span><h1 style="margin-top:9px">偏好设置</h1><p>按照你的节奏安排。所有日期与倒数日使用北京时间。</p></header><form id="settings-form"><section class="settings-card"><h2>三个专注时段</h2><p>每段的任务预计时长会合计，超出可用时间时会显示提示。已完成任务仍计入当天安排。</p>${SLOT_IDS.map(id=>`<div class="settings-row"><label for="${id}-start">${SLOT_NAMES[id]}</label><div class="time-pair"><input id="${id}-start" name="${id}-start" aria-label="${SLOT_NAMES[id]}开始时间" type="time" value="${s.slots[id][0]}" required><span>至</span><input name="${id}-end" aria-label="${SLOT_NAMES[id]}结束时间" type="time" value="${s.slots[id][1]}" required></div></div>`).join('')}<div class="settings-row"><label>锻炼安排</label><label class="setting-switch"><input type="checkbox" name="exerciseEnabled" ${s.exerciseEnabled?'checked':''}>在每日计划中显示</label></div><div class="settings-row"><label>锻炼时间</label><div class="time-pair"><input aria-label="锻炼开始时间" type="time" name="exercise-start" value="${s.exercise[0]}" required><span>至</span><input aria-label="锻炼结束时间" type="time" name="exercise-end" value="${s.exercise[1]}" required></div></div><p style="margin:12px 0 0">锻炼默认预留 1 小时，你可以自由调整。</p></section><section class="settings-card"><h2>课表占用提示</h2><p>仅在专注时段提示普通课程占用，并扣减可安排时长。实验课及第 9–12 节已排除。</p><label class="setting-switch" style="font-size:12px"><input type="checkbox" name="courseHints" ${s.courseHints?'checked':''}>参考普通课程，计算可用时间</label><div class="settings-row"><label for="semester">第 1 周的周一</label><input type="date" id="semester" name="semester" value="${s.semester}" required></div><details><summary>查看课表参考信息</summary><div class="course-list">2026–2027 学年第 1 学期 · 来源：我的课表.xlsx<br>开始日期与第 1–8 节时间依据你提供的截图。<br>${[...new Set((window.COURSE_DATA||[]).map(c=>c.name))].map(esc).join('、')}<br><br>${SECTIONS.map((p,i)=>`第 ${i+1} 节 ${p.join('–')}`).join(' &nbsp; / &nbsp; ')}<br>教学周按 7 个自然日递增；节假日或临时调课时，可关闭占用提示。</div></details></section><div class="settings-footer"><span>修改后点击保存即可生效</span><div class="form-error" id="settings-error"></div><button class="button primary" type="submit">保存设置</button></div></form><section class="settings-card" style="margin-top:25px"><h2>数据与备份</h2><p>计划自动保存在当前设备的当前浏览器。不同设备、浏览器和本地文件各自保存，不会自动同步；清理浏览器数据会移除计划。建议定期导出备份。</p><div class="settings-actions"><button class="button" data-action="export">${icon('download')} 导出备份</button><button class="button" data-action="import">从备份恢复</button></div><p class="settings-info" style="margin:16px 0 0">恢复会替换当前计划，操作前会先显示备份中的任务与倒数日数量。</p></section><section class="settings-card"><h2>关于时序</h2><p class="settings-info" style="margin:0">为一天三段专注设计的轻量计划工具。支持任务完成、改期、周／月日历、重要日期和备份。界面与代码独立编写，时间分块、拖动安排和未完成顺延的交互参考了 <a href="https://github.com/ShadowWalker2014/open-sunsama" target="_blank" rel="noopener noreferrer">Open Sunsama</a>。<br>倒数日是页面内提示；关闭页面后不会发送通知。</p></section></div>`;}
function showDialog(title,body,footer){$('#dialog-content').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="icon-button" aria-label="关闭" data-action="close-dialog">${icon('close')}</button></div>${body}${footer||''}`;if(!$('#editor').open)$('#editor').showModal();}
function taskEditor(id,defaults={}){const old=state.tasks.find(t=>t.id===id);const t=old||{id:'',title:'',date:defaults.date===undefined?selected:defaults.date,slot:defaults.slot||'morning',minutes:45,priority:'normal',due:'',note:'',done:false};showDialog(old?'编辑任务':'新建任务',`<form id="task-form"><div class="dialog-body"><input type="hidden" name="id" value="${esc(t.id)}"><label class="field"><span>要完成什么</span><input name="title" placeholder="例如：完成一组习题并整理错题" maxlength="200" value="${esc(t.title)}" required autofocus></label><div class="field-grid"><label class="field"><span>计划日期 · 留空为待安排</span><input type="date" name="date" value="${esc(t.date)}"></label><label class="field"><span>专注时段</span><select name="slot">${SLOT_IDS.map(id=>`<option value="${id}" ${id===t.slot?'selected':''}>${SLOT_NAMES[id]} ${state.settings.slots[id].join('–')}</option>`).join('')}</select></label><label class="field"><span>预计时长（分钟）</span><input type="number" min="5" max="600" step="5" name="minutes" value="${t.minutes}" required></label><label class="field"><span>优先级</span><select name="priority">${[['high','优先完成'],['normal','普通'],['low','有空再做']].map(([id,name])=>`<option value="${id}" ${t.priority===id?'selected':''}>${name}</option>`).join('')}</select></label></div><label class="field"><span>截止日期 · 可选，会自动显示倒数日</span><input type="date" name="due" value="${esc(t.due)}"></label><label class="field"><span>备注 · 可选</span><textarea name="note" maxlength="3000" placeholder="具体要做的步骤、资料或完成标准">${esc(t.note)}</textarea></label><div id="task-capacity" class="form-help"></div><div class="form-error" id="task-error"></div></div><div class="dialog-footer">${old?`<button class="button danger" type="button" data-action="delete-task" data-id="${esc(t.id)}">删除</button>`:''}<button class="button" type="button" data-action="close-dialog">取消</button><button class="button primary" type="submit">${old?'保存修改':'添加任务'}</button></div></form>`);updateTaskHint();}
function updateTaskHint(){const form=$('#task-form');if(!form)return;const f=new FormData(form),date=f.get('date'),slot=f.get('slot');if(!date){$('#task-capacity').textContent='先加入任务清单，之后再安排日期。';return;}const cap=capacity(date,slot),used=plannedMinutes(date,slot,f.get('id')),duration=+f.get('minutes');$('#task-capacity').textContent=`这段可用 ${cap.available} 分钟，已有任务 ${used} 分钟。${used+duration>cap.available?'加入后将超出可用时间，建议拆分任务或换个时段。':''}${f.get('due')&&date>f.get('due')?' 计划日期晚于截止日期，请留意。':''}`;}
function milestoneEditor(id){const old=state.milestones.find(m=>m.id===id),m=old||{id:'',title:'',date:'',type:'exam',done:false,note:''};showDialog(old?'编辑重要日子':'添加倒数日',`<form id="milestone-form"><div class="dialog-body"><input type="hidden" name="id" value="${esc(m.id)}"><label class="field"><span>名称</span><input name="title" maxlength="200" value="${esc(m.title)}" placeholder="例如：期末考试、论文提交" required autofocus></label><div class="field-grid"><label class="field"><span>日期</span><input type="date" name="date" value="${m.date}" required></label><label class="field"><span>类型</span><select name="type">${[['exam','考试'],['deadline','截止日'],['other','目标日']].map(([id,label])=>`<option value="${id}" ${id===m.type?'selected':''}>${label}</option>`).join('')}</select></label></div><label class="field"><span>备注 · 可选</span><textarea name="note" maxlength="3000" placeholder="范围、地点或准备事项">${esc(m.note)}</textarea></label><label class="checkbox-field"><input name="done" type="checkbox" ${m.done?'checked':''}>已完成，收起倒数提醒</label><div class="form-error" id="milestone-error"></div></div><div class="dialog-footer">${old?`<button class="button danger" type="button" data-action="delete-milestone" data-id="${esc(m.id)}">删除</button>`:''}<button class="button" type="button" data-action="close-dialog">取消</button><button class="button primary" type="submit">${old?'保存修改':'添加日期'}</button></div></form>`);}
function confirmDialog(title,text,action,label='确认'){showDialog(title,`<div class="dialog-body"><p style="font-size:13px;line-height:1.9">${esc(text)}</p></div><div class="dialog-footer"><button class="button" data-action="close-dialog">取消</button><button class="button primary" id="confirm-action">${label}</button></div>`);$('#confirm-action').onclick=()=>{$('#editor').close();action();};}
function scheduleTask(id,date=selected,slot){const task=state.tasks.find(t=>t.id===id);if(!task)return;slot=slot||SLOT_IDS.find(s=>capacity(date,s).available-plannedMinutes(date,s,id)>=task.minutes);if(!slot){taskEditor(id);$('#task-error').textContent='这天的空余时间不足以容纳整项任务，可以改日期或缩短预计时长。';return;}mutate(()=>{task.date=date;task.slot=slot;},`已安排到 ${shortDate(date)}${SLOT_NAMES[slot]}`);const cap=capacity(date,slot);if(plannedMinutes(date,slot)>cap.available)toast(`已移动，但该时段超出可用时间 ${plannedMinutes(date,slot)-cap.available} 分钟`,true);}
function autoPlan(){const pending=sortedTasks(state.tasks.filter(t=>!t.done&&!t.date));if(!pending.length){toast('没有待安排的任务');return;}const assignments=[],used=Object.fromEntries(SLOT_IDS.map(s=>[s,plannedMinutes(selected,s)]));for(const t of pending){if(t.due&&t.due<selected)continue;const slot=SLOT_IDS.find(s=>capacity(selected,s).available-used[s]>=t.minutes);if(slot){assignments.push([t.id,slot]);used[slot]+=t.minutes;}}
 if(!assignments.length){toast('当天可用时间不足，或任务截止日已过。请手动调整日期或时长。');return;}
 confirmDialog('安排待办',`按截止日期和优先级，把 ${assignments.length} 项任务放入 ${shortDate(selected)}的三个时段；其余 ${pending.length-assignments.length} 项保留在待安排。`,()=>mutate(()=>{for(const [id,slot]of assignments){const t=state.tasks.find(t=>t.id===id);t.date=selected;t.slot=slot;}view='calendar';calendarAnchor=selected;},`已安排 ${assignments.length} 项任务`),'确认安排');
}
function exportBackup(){const data=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`时序备份-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已导出，可在其他设备导入');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const {action,id,date,slot}=b.dataset;
 switch(action){
 case 'nav':view=b.dataset.view;render();window.scrollTo(0,0);break;
 case 'new-task':taskEditor(null,{date:date===undefined?selected:date,slot});break;
 case 'edit-task':taskEditor(id);break;
 case 'toggle-task':mutate(()=>{const t=state.tasks.find(t=>t.id===id);t.done=!t.done;},'任务状态已更新');break;
 case 'new-milestone':milestoneEditor();break;
 case 'edit-milestone':milestoneEditor(id);break;
 case 'close-dialog':$('#editor').close();break;
 case 'delete-task':confirmDialog('删除任务','删除后可通过底部的「撤销」恢复。',()=>mutate(()=>{state.tasks=state.tasks.filter(t=>t.id!==id);},'任务已删除'),'删除任务');break;
 case 'delete-milestone':confirmDialog('删除倒数日','删除后可通过底部的「撤销」恢复。',()=>mutate(()=>{state.milestones=state.milestones.filter(t=>t.id!==id);},'倒数日已删除'),'删除日期');break;
 case 'exercise':mutate(()=>{if(state.exerciseDone[selected])delete state.exerciseDone[selected];else state.exerciseDone[selected]=true;},state.exerciseDone[selected]?'已取消锻炼打卡':'今天的锻炼，完成了');break;
 case 'select-date':if(validDate(date)){selected=date;calendarAnchor=date;view='calendar';render();}break;
 case 'today':selected=today();calendarAnchor=selected;render();break;
 case 'mini-month':{const d=parseDate(selected);selected=localDate(new Date(d.getFullYear(),d.getMonth()+Number(b.dataset.delta),1));calendarAnchor=selected;view='calendar';render();break;}
 case 'calendar-prev':case 'calendar-next':{const delta=action==='calendar-next'?1:-1;if(calendarMode==='week')calendarAnchor=addDays(calendarAnchor,7*delta);else{const d=parseDate(calendarAnchor);calendarAnchor=localDate(new Date(d.getFullYear(),d.getMonth()+delta,1));}render();break;}
 case 'calendar-mode':calendarMode=b.dataset.mode;render();break;
 case 'filter':filter=b.dataset.filter;render();break;
 case 'schedule-task':scheduleTask(id);break;
 case 'tomorrow':{const t=state.tasks.find(t=>t.id===id);scheduleTask(id,addDays(t.date||selected,1),t.slot);break;}
 case 'rollover':{const tasks=tasksIn(selected).filter(t=>!t.done);if(!tasks.length){toast('这天没有需要顺延的任务');break;}const next=addDays(selected,1);confirmDialog('把未完成任务顺延一天',`将 ${tasks.length} 项任务移到 ${shortDate(next)}，保留原时段。截止日期保持不变，超出时间的时段会显示提示。`,()=>mutate(()=>{for(const t of tasks)t.date=next;selected=next;calendarAnchor=next;},`已顺延 ${tasks.length} 项任务`),'确认顺延');break;}
 case 'auto-plan':autoPlan();break;
 case 'undo':if(undoState){state=undoState.state;selected=undoState.selected;calendarAnchor=undoState.calendarAnchor;undoState=null;save();render();toast('已撤销上一步修改');}break;
 case 'export':exportBackup();break;
 case 'import':$('#import-file').click();break;
 }
});
document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();view='calendar';selected=today();calendarAnchor=selected;render();});
document.addEventListener('change',e=>{if(e.target.id==='plan-date'&&validDate(e.target.value)){selected=e.target.value;calendarAnchor=selected;render();}if(e.target.closest('#task-form'))updateTaskHint();});
document.addEventListener('input',e=>{if(e.target.id==='task-search'){const pos=e.target.selectionStart;search=e.target.value;$('#main').innerHTML=renderTasks();$('#task-search').focus();$('#task-search').setSelectionRange(pos,pos);}if(e.target.closest('#task-form'))updateTaskHint();});
document.addEventListener('submit',e=>{const form=e.target;const formId=form.getAttribute('id');if(!['task-form','milestone-form','settings-form','quick-task'].includes(formId))return;e.preventDefault();const f=new FormData(form);
 if(formId==='quick-task'){const title=String(f.get('title')).trim();if(!title)return;mutate(()=>state.tasks.push({id:uid(),title,date:'',slot:'morning',minutes:45,priority:'normal',due:'',done:false,note:''}),'已加入待安排');return;}
 if(formId==='task-form'){const old=state.tasks.find(t=>t.id===f.get('id'));const t={id:old?.id||uid(),title:String(f.get('title')).trim(),date:String(f.get('date')),slot:String(f.get('slot')),minutes:Number(f.get('minutes')),priority:String(f.get('priority')),due:String(f.get('due')),note:String(f.get('note')).trim(),done:old?.done||false};try{validateState({...state,tasks:[...state.tasks.filter(x=>x.id!==t.id),t]});}catch(err){$('#task-error').textContent=err.message;return;}$('#editor').close();mutate(()=>{if(old)Object.assign(old,t);else state.tasks.push(t);},old?'任务已更新':t.date?'已添加到专注计划':'已加入待安排');return;}
 if(formId==='milestone-form'){const old=state.milestones.find(m=>m.id===f.get('id'));const m={id:old?.id||uid(),title:String(f.get('title')).trim(),date:String(f.get('date')),type:String(f.get('type')),note:String(f.get('note')).trim(),done:f.has('done')};try{validateState({...state,milestones:[...state.milestones.filter(x=>x.id!==m.id),m]});}catch(err){$('#milestone-error').textContent=err.message;return;}$('#editor').close();mutate(()=>{if(old)Object.assign(old,m);else state.milestones.push(m);},'重要日期已保存');return;}
 if(formId==='settings-form'){const s={semester:String(f.get('semester')),courseHints:f.has('courseHints'),exerciseEnabled:f.has('exerciseEnabled'),exercise:[String(f.get('exercise-start')),String(f.get('exercise-end'))],slots:Object.fromEntries(SLOT_IDS.map(id=>[id,[String(f.get(id+'-start')),String(f.get(id+'-end'))]]))};try{validateState({...state,settings:s});}catch(err){$('#settings-error').textContent=err.message;return;}mutate(()=>{state.settings=s;},'设置已保存');}
});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>15*1024*1024)throw Error('备份文件过大');const incoming=validateState(JSON.parse(await file.text()));confirmDialog('从备份恢复',`备份含 ${incoming.tasks.length} 项任务、${incoming.milestones.length} 个重要日期。将替换当前的 ${state.tasks.length} 项任务和 ${state.milestones.length} 个重要日期。建议先导出当前备份。`,()=>mutate(()=>{state=incoming;},'备份已恢复'),'替换并恢复');}catch(err){toast('无法导入：'+err.message);}});
let draggedId='';document.addEventListener('dragstart',e=>{const task=e.target.closest('[data-task-id]');if(task){draggedId=task.dataset.taskId;e.dataTransfer.setData('text/plain',draggedId);e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',e=>{const target=e.target.closest('[data-drop-date]');if(target&&draggedId){e.preventDefault();target.classList.add('drop-target');}});
document.addEventListener('dragleave',e=>{const target=e.target.closest('[data-drop-date]');if(target&&!target.contains(e.relatedTarget))target.classList.remove('drop-target');});
document.addEventListener('drop',e=>{const target=e.target.closest('[data-drop-date]');if(target&&draggedId){e.preventDefault();scheduleTask(draggedId,target.dataset.dropDate,target.dataset.dropSlot);}draggedId='';document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));});
document.addEventListener('dragend',()=>{draggedId='';document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));});
window.addEventListener('storage',e=>{if(e.key===STORAGE&&e.newValue){if($('#editor').open){toast('另一个标签页修改了计划；请先关闭编辑窗口再刷新，以查看最新数据。');return;}try{state=validateState(JSON.parse(e.newValue));undoState=null;render();toast('已更新另一个标签页的修改');}catch{toast('另一个标签页的数据格式异常，请检查备份');}}});
setInterval(()=>{const now=today();if(lastToday!==now){const wasToday=selected===lastToday;lastToday=now;if(wasToday){selected=now;calendarAnchor=now;}if(!$('#editor').open)render();}},30000);
render();if(initialError)toast(initialError);
// Expose pure helpers for integrity checks; user data remains in this browser.
window.Dayloom={dateDiff,addDays,weekStart,validDate,validateState,defaultSettings,capacity,courseEvents,getState:()=>clone(state)};
})();
</script>
</body></html>
